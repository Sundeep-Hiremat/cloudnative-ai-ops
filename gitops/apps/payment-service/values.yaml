replicaCount: 3

image:
  repository: registry.internal.io/ecommerce/payment-service
  pullPolicy: IfNotPresent
  tag: "v2.4.1"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: APP_ENV
    value: "production"
  - name: CACHE_SIZE
    value: "5000"
  - name: LOG_LEVEL
    value: "info"
